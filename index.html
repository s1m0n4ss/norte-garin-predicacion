<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Predicación Pública · Norte Garín</title>
  <meta name="theme-color" content="#f1f5f9" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Predicación · Norte Garín" />
  <meta name="description" content="Programa de predicación pública con exhibidores · Congregación Norte Garín" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #f1f5f9;
      color: #0f172a;
      font-family: 'Outfit', system-ui, sans-serif;
      min-height: 100vh;
      font-size: 15px;
      -webkit-tap-highlight-color: transparent;
    }

    /* ── LOGIN SCREEN ── */
    #loginScreen {
      position: fixed; inset: 0;
      background: #f1f5f9;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
    }
    #loginScreen.vis { display: flex; }

    .login-card {
      width: 100%; max-width: 380px;
      background: #fff;
      border-radius: 20px;
      padding: 40px 28px 32px;
      box-shadow: 0 4px 40px rgba(15,23,42,0.10);
      text-align: center;
    }
    .login-eyebrow {
      font-size: 11px; font-weight: 700;
      letter-spacing: .18em; text-transform: uppercase;
      color: #94a3b8; margin-bottom: 10px;
    }
    .login-title {
      font-size: 28px; font-weight: 800;
      color: #0f172a; line-height: 1.15; margin-bottom: 6px;
    }
    .login-sub { font-size: 13px; color: #94a3b8; margin-bottom: 36px; }
    .login-input {
      width: 100%;
      background: #fff;
      border: 1.5px solid #e2e8f0;
      border-radius: 14px;
      color: #0f172a;
      padding: 16px 20px;
      font-size: 16px; font-family: 'Outfit', sans-serif;
      outline: none;
      transition: border-color .15s;
      margin-bottom: 14px;
      text-align: center;
    }
    .login-input::placeholder { color: #cbd5e1; }
    .login-input:focus { border-color: #2563eb; }
    .login-btn {
      width: 100%;
      background: #2563eb;
      color: #fff; border: none;
      border-radius: 14px;
      padding: 16px;
      font-size: 16px; font-weight: 700; font-family: 'Outfit', sans-serif;
      cursor: pointer; transition: background .15s;
    }
    .login-btn:active { background: #1d4ed8; }

    /* ── BANNER (sticky) ── */
    #appBanner {
      display: none;
      position: sticky; top: 0; z-index: 40;
      background: #fff;
      border-bottom: 2px solid #0f172a;
      padding: 20px 20px 0;
    }
    #appBanner.vis { display: block; }

    .banner-inner { max-width: 800px; margin: 0 auto; }

    .banner-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 16px;
    }
    .banner-eyebrow {
      font-size: 10px; font-weight: 700;
      letter-spacing: .14em; text-transform: uppercase;
      color: #94a3b8; margin-bottom: 5px;
    }
    .banner-brand {
      display: flex; align-items: baseline; gap: 8px;
    }
    .banner-pp {
      font-size: 32px; font-weight: 900;
      color: #0f172a; line-height: 1;
    }
    .banner-pp-label {
      font-size: 11px; font-weight: 600;
      color: #64748b; line-height: 1.35;
    }
    .banner-right { text-align: right; }
    .banner-user-label {
      font-size: 10px; font-weight: 700;
      letter-spacing: .12em; text-transform: uppercase;
      color: #94a3b8; margin-bottom: 3px;
    }
    .banner-user-name {
      font-size: 13px; font-weight: 700; color: #0f172a;
      cursor: pointer; margin-bottom: 7px;
      max-width: 150px; overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap;
    }
    .banner-user-name:active { color: #2563eb; }
    .banner-dots {
      display: flex; gap: 5px; justify-content: flex-end;
    }
    .banner-dot {
      width: 8px; height: 8px; border-radius: 50%;
    }

    /* Banner bottom: next turns */
    .banner-bottom {
      border-top: 1px solid #f1f5f9;
      padding: 12px 0 14px;
    }
    .banner-bottom-label {
      font-size: 9px; font-weight: 800;
      letter-spacing: .15em; text-transform: uppercase;
      color: #94a3b8; margin-bottom: 9px;
    }
    .banner-turns { display: flex; gap: 20px; }
    .banner-turn { flex: 1; min-width: 0; }
    .banner-turn-time {
      font-size: 14px; font-weight: 700; color: #0f172a;
      margin-bottom: 2px;
    }
    .banner-turn-loc {
      font-size: 11px; font-weight: 600; color: #2563eb;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .banner-no-turns {
      font-size: 13px; color: #94a3b8; font-style: italic;
    }

    /* ── LOADING ── */
    #loadingState {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 100px 0;
    }
    .spinner {
      width: 28px; height: 28px;
      border: 2.5px solid #e2e8f0;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      margin-bottom: 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-txt { font-size: 13px; color: #94a3b8; }

    /* ── APP CONTENT ── */
    #appContent {
      display: none;
      max-width: 800px;
      margin: 0 auto;
      padding: 16px 0 100px;
    }
    #appContent.vis { display: block; }

    /* ── GRID ── */
    .grid-section { }

    .grid-legend {
      display: flex;
      gap: 14px;
      padding: 0 12px 10px 80px;
      flex-wrap: wrap;
    }
    .legend-item {
      display: flex; align-items: center; gap: 5px;
      font-size: 10px; font-weight: 600; color: #64748b;
    }
    .legend-dot {
      width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
    }

    /* Scroll container con indicador de fade a la derecha */
    .grid-scroll-container { position: relative; }
    .grid-wrap {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      padding: 0 12px;
    }
    .scroll-fade {
      position: absolute;
      top: 0; right: 0; bottom: 0; width: 52px;
      background: linear-gradient(to right, transparent, #f1f5f9);
      pointer-events: none;
      transition: opacity .18s;
      z-index: 2;
    }
    .scroll-fade.hidden { opacity: 0; }

    .schedule-grid {
      display: grid;
      grid-template-columns: 68px repeat(7, 1fr);
      min-width: 520px;
      gap: 3px;
    }

    /* Day header cells */
    .gh-day {
      font-size: 10px; font-weight: 700;
      text-align: center; color: #94a3b8;
      padding-bottom: 8px;
      display: flex; flex-direction: column; align-items: center; gap: 3px;
    }
    .gh-day.gh-today { color: #2563eb; font-weight: 800; }
    .gh-pip {
      width: 5px; height: 5px; border-radius: 50%;
      background: #2563eb;
    }

    /* Location label */
    .gl-loc {
      font-size: 9px; font-weight: 700;
      color: #94a3b8; text-transform: uppercase;
      letter-spacing: .04em; line-height: 1.35;
      display: flex; align-items: center;
      padding-right: 4px;
    }

    /* Grid cells */
    .gc {
      min-height: 56px;
      border-radius: 8px;
      padding: 6px 4px;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      text-align: center;
      cursor: pointer;
      transition: filter .12s;
      overflow: hidden;
      position: relative;
    }
    .gc:active { filter: brightness(.95); }

    /* Sin turno ese día: fondo plano, sin borde, sin interacción */
    .gc-none {
      background: #f1f5f9;
      cursor: default;
    }
    .gc-none:active { filter: none; }

    /* Con turno pero sin anotados */
    .gc-free {
      background: #fff;
      border: 1px solid #e2e8f0;
    }
    .gc-with-people {
      background: #dcfce7;
      border: 1px solid #86efac;
    }
    .gc-mine {
      background: #dbeafe;
      border: 1px solid #93c5fd;
    }
    .gc-full {
      background: #fee2e2;
      border: 1px solid #fca5a5;
    }

    /* Punto indicador "yo estoy anotado" */
    .gc-pip {
      position: absolute;
      top: 5px; right: 5px;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #2563eb;
      flex-shrink: 0;
    }

    /* Resalte sutil del día actual en todas las celdas activas */
    .gc-today-col:not(.gc-none) {
      box-shadow: inset 0 0 0 1.5px rgba(37,99,235,0.22);
    }

    .gc-txt {
      font-size: 9px; font-weight: 600;
      line-height: 1.4;
      display: block;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .gc-free .gc-txt        { color: #cbd5e1; }
    .gc-with-people .gc-txt { color: #64748b; }
    .gc-mine .gc-txt        { color: #1d4ed8; }
    .gc-full .gc-txt        { color: #dc2626; }

    /* ── BOTTOM SHEET ── */
    #sheetOverlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0);
      z-index: 60; display: none;
      transition: background .25s;
    }
    #sheetOverlay.open { display: block; background: rgba(15,23,42,0.45); }

    #bottomSheet {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: #fff;
      border-radius: 20px 20px 0 0;
      padding: 0 20px calc(28px + env(safe-area-inset-bottom));
      z-index: 61;
      transform: translateY(100%);
      transition: transform .3s cubic-bezier(.32,.72,0,1);
      max-width: 640px;
      margin: 0 auto;
      max-height: 88vh;
      overflow-y: auto;
    }
    #bottomSheet.open { transform: translateY(0); }

    .sheet-handle {
      width: 36px; height: 4px;
      background: #e2e8f0;
      border-radius: 2px;
      margin: 12px auto 18px;
    }

    .sheet-loc {
      font-size: 17px; font-weight: 800;
      color: #0f172a; margin-bottom: 3px;
    }
    .sheet-day-lbl {
      font-size: 13px; font-weight: 600;
      color: #2563eb; margin-bottom: 20px;
    }
    .sheet-section-lbl {
      font-size: 9px; font-weight: 800;
      letter-spacing: .15em; text-transform: uppercase;
      color: #94a3b8; margin-bottom: 10px;
    }

    /* Block rows */
    .sbl-row {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 8px;
    }
    .sbl-top {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 8px;
    }
    .sbl-time {
      font-size: 13px; font-weight: 700; color: #0f172a;
      flex-shrink: 0; min-width: 96px;
    }
    .sbl-dots {
      display: flex; gap: 5px; flex: 1;
    }
    .sbl-dot {
      width: 11px; height: 11px; border-radius: 50%;
      background: #e2e8f0; flex-shrink: 0;
    }
    .sbl-dot.dot-taken { background: #94a3b8; }
    .sbl-dot.dot-mine  { background: #2563eb; }
    .sbl-action { flex-shrink: 0; }

    .sbl-btn {
      border: none; border-radius: 8px;
      padding: 7px 12px;
      font-size: 12px; font-weight: 700;
      font-family: 'Outfit', sans-serif;
      cursor: pointer; transition: filter .12s;
    }
    .sbl-btn:active { filter: brightness(.93); }
    .sbl-btn-join  { background: #2563eb; color: #fff; }
    .sbl-btn-leave { background: #fee2e2; color: #dc2626; border: 1px solid #fca5a5; }
    .sbl-btn-full  { background: #f1f5f9; color: #94a3b8; cursor: default; font-weight: 600; }

    .sbl-names {
      font-size: 11px; color: #64748b; line-height: 1.5;
    }
    .sbl-names .sbl-mine { color: #2563eb; font-weight: 700; }
    .sbl-names .sbl-empty { color: #cbd5e1; font-style: italic; }
  </style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="loginScreen">
  <div class="login-card">
    <div class="login-eyebrow">Norte Garín · 2026</div>
    <div class="login-title">Predicación Pública</div>
    <div class="login-sub">Ingresá tu nombre para ver y anotarte en los turnos</div>
    <input type="text" id="nameInput" class="login-input" placeholder="Tu nombre completo" autocomplete="name" />
    <button class="login-btn" onclick="saveName()">Ingresar</button>
  </div>
</div>

<!-- BANNER -->
<header id="appBanner">
  <div class="banner-inner">
    <div class="banner-top">
      <div class="banner-left">
        <div class="banner-eyebrow">Norte Garín · 2026</div>
        <div class="banner-brand">
          <span class="banner-pp">PP</span>
          <span class="banner-pp-label">Predicación /<br>Pública</span>
        </div>
      </div>
      <div class="banner-right">
        <div class="banner-user-label">Publicador</div>
        <div id="bannerUserName" class="banner-user-name" onclick="showLogin()" title="Cambiar nombre"></div>
        <div class="banner-dots">
          <div class="banner-dot" style="background:#2563eb"></div>
          <div class="banner-dot" style="background:#16a34a"></div>
          <div class="banner-dot" style="background:#ca8a04"></div>
        </div>
      </div>
    </div>
    <div class="banner-bottom">
      <div class="banner-bottom-label">Mi próximo turno</div>
      <div id="bannerTurns" class="banner-turns"></div>
    </div>
  </div>
</header>

<!-- LOADING -->
<div id="loadingState">
  <div class="spinner"></div>
  <div class="loading-txt">Cargando programa...</div>
</div>

<!-- APP CONTENT (grid) -->
<div id="appContent"></div>

<!-- SHEET OVERLAY -->
<div id="sheetOverlay" onclick="closeSheet()"></div>

<!-- BOTTOM SHEET -->
<div id="bottomSheet">
  <div class="sheet-handle"></div>
  <div id="sheetLoc" class="sheet-loc"></div>
  <div id="sheetDayLbl" class="sheet-day-lbl"></div>
  <div class="sheet-section-lbl">Horarios</div>
  <div id="sheetBlocks"></div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script>
  const firebaseConfig = {
    apiKey:            "AIzaSyAiIdLMX-Et4vHIGNE-5bKd_8GN_hsRiYI",
    authDomain:        "predicacion-publica-850aa.firebaseapp.com",
    databaseURL:       "https://predicacion-publica-850aa-default-rtdb.firebaseio.com",
    projectId:         "predicacion-publica-850aa",
    storageBucket:     "predicacion-publica-850aa.firebasestorage.app",
    messagingSenderId: "312049713615",
    appId:             "1:312049713615:web:e07a898e7a0df4c87dd2ba",
    measurementId:     "G-0WC3TV34T5"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  // ── SCHEDULE DATA ──────────────────────────────────────
  const UBICACIONES_SEMANA = ["Hospital Garín", "Estación Garín", "Puente 5"];
  const UBICACION_DOMINGO  = ["Mini Estación Garín"];

  const SCHEDULE = [
    { dia: "Lunes",     bloques: ["07:00-08:00","08:00-09:00","15:00-16:00","16:00-17:00"],                        ubicaciones: UBICACIONES_SEMANA },
    { dia: "Martes",    bloques: ["07:00-08:00","08:00-09:00","09:00-10:00","10:00-11:00","11:00-12:00"],           ubicaciones: UBICACIONES_SEMANA },
    { dia: "Miércoles", bloques: ["15:00-16:00","16:00-17:00","17:00-18:00","18:00-19:00","19:00-20:00"],           ubicaciones: UBICACIONES_SEMANA },
    { dia: "Jueves",    bloques: ["07:00-08:00","08:00-09:00"],                                                     ubicaciones: UBICACIONES_SEMANA },
    { dia: "Viernes",   bloques: ["07:00-08:00","08:00-09:00","17:00-18:00","18:00-19:00","19:00-20:00"],           ubicaciones: UBICACIONES_SEMANA },
    { dia: "Sábado",    bloques: ["07:00-08:00","08:00-09:00"],                                                     ubicaciones: UBICACIONES_SEMANA },
    { dia: "Domingo",   bloques: ["17:00-18:00","18:00-19:00","19:00-20:00"],                                       ubicaciones: UBICACION_DOMINGO  },
  ];

  const DAY_INDEX = { "Lunes":1,"Martes":2,"Miércoles":3,"Jueves":4,"Viernes":5,"Sábado":6,"Domingo":0 };

  const ALL_LOCS  = ["Hospital Garín","Estación Garín","Puente 5","Mini Estación Garín"];
  const ALL_DAYS  = ["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"];

  const SHORT_DAYS = {
    "Lunes":"Lun","Martes":"Mar","Miércoles":"Mié",
    "Jueves":"Jue","Viernes":"Vie","Sábado":"Sáb","Domingo":"Dom"
  };
  const SHORT_LOC = {
    "Hospital Garín":     "Hosp.\nGarín",
    "Estación Garín":     "Est.\nGarín",
    "Puente 5":           "Puente 5",
    "Mini Estación Garín":"Mini Est."
  };

  // "dia::ub" → [bloque, ...]
  const CELL_BLOCKS = {};
  for (const { dia, bloques, ubicaciones } of SCHEDULE) {
    for (const ub of ubicaciones) CELL_BLOCKS[`${dia}::${ub}`] = bloques;
  }

  // ── HELPERS ────────────────────────────────────────────
  function turnoId(dia, bloque, ubicacion) {
    const [ini, fin] = bloque.split("-");
    const d = dia.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
    const u = ubicacion.toLowerCase().replace(/\s+/g,"").normalize("NFD").replace(/[̀-ͯ]/g,"");
    return `${d}_${ini.replace(":","")}_${fin.replace(":","")}_${u}`;
  }

  function escHtml(s) {
    return String(s)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;")
      .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  // ── STATE ──────────────────────────────────────────────
  let myName       = localStorage.getItem("predicacion_nombre") || "";
  let turnosData   = {};
  let fbLoaded     = false;
  let sheetCellDia = null;
  let sheetCellUb  = null;

  // ── NAME ───────────────────────────────────────────────
  window.saveName = function() {
    const v = document.getElementById("nameInput").value.trim();
    if (!v) return;
    myName = v;
    localStorage.setItem("predicacion_nombre", v);
    hideLogin();
    if (fbLoaded) render();
  };

  window.showLogin = function() {
    document.getElementById("nameInput").value = myName;
    document.getElementById("loginScreen").classList.add("vis");
    document.getElementById("appBanner").classList.remove("vis");
    document.getElementById("appContent").classList.remove("vis");
    setTimeout(() => document.getElementById("nameInput").focus(), 80);
  };

  function hideLogin() {
    document.getElementById("loginScreen").classList.remove("vis");
    document.getElementById("appBanner").classList.add("vis");
    document.getElementById("appContent").classList.add("vis");
  }

  document.getElementById("nameInput").addEventListener("keydown", e => {
    if (e.key === "Enter") window.saveName();
  });

  // ── FIREBASE ───────────────────────────────────────────
  const turnosRef = db.ref("predicacion/turnos");
  turnosRef.on("value", snap => {
    turnosData = snap.val() || {};
    fbLoaded   = true;
    document.getElementById("loadingState").style.display = "none";
    if (myName) { hideLogin(); render(); }
    if (sheetCellDia) refreshSheet();
  });

  window.anotarme = async function(tid) {
    const anotados = turnosData[tid]?.anotados || {};
    if (Object.keys(anotados).length >= 4) return;
    await db.ref(`predicacion/turnos/${tid}/anotados`).push({ nombre: myName, timestamp: Date.now() });
  };

  window.desanotarme = async function(tid) {
    const anotados = turnosData[tid]?.anotados || {};
    for (const [pid, val] of Object.entries(anotados)) {
      if (val.nombre === myName) {
        await db.ref(`predicacion/turnos/${tid}/anotados/${pid}`).remove();
        return;
      }
    }
  };

  // ── BOTTOM SHEET ───────────────────────────────────────
  window.openSheet = function(dia, ub) {
    sheetCellDia = dia;
    sheetCellUb  = ub;
    document.getElementById("sheetLoc").textContent    = ub;
    document.getElementById("sheetDayLbl").textContent = dia;
    refreshSheet();
    document.getElementById("sheetOverlay").classList.add("open");
    document.getElementById("bottomSheet").classList.add("open");
    document.body.style.overflow = "hidden";
  };

  window.closeSheet = function() {
    sheetCellDia = null;
    sheetCellUb  = null;
    document.getElementById("sheetOverlay").classList.remove("open");
    document.getElementById("bottomSheet").classList.remove("open");
    document.body.style.overflow = "";
  };

  function refreshSheet() {
    if (!sheetCellDia) return;
    const dia    = sheetCellDia;
    const ub     = sheetCellUb;
    const bloques = CELL_BLOCKS[`${dia}::${ub}`] || [];

    let html = "";
    for (const bl of bloques) {
      const tid     = turnoId(dia, bl, ub);
      const entries = Object.entries(turnosData[tid]?.anotados || {})
                            .sort((a,b) => a[1].timestamp - b[1].timestamp);
      const count   = entries.length;
      const isMine  = entries.some(([,v]) => v.nombre === myName);
      const full    = count >= 4;

      // 4 availability dots
      const dots = Array.from({length: 4}, (_, i) => {
        if (i < count) {
          const cls = entries[i][1].nombre === myName ? "dot-mine" : "dot-taken";
          return `<div class="sbl-dot ${cls}"></div>`;
        }
        return `<div class="sbl-dot"></div>`;
      }).join("");

      // Per-block action — tid is safe ASCII, inline onclick is fine
      let actionBtn;
      if (isMine) {
        actionBtn = `<button class="sbl-btn sbl-btn-leave" onclick="window.desanotarme('${tid}')">Desanotarme</button>`;
      } else if (full) {
        actionBtn = `<button class="sbl-btn sbl-btn-full" disabled>Lleno</button>`;
      } else {
        actionBtn = `<button class="sbl-btn sbl-btn-join" onclick="window.anotarme('${tid}')">Anotarme</button>`;
      }

      // Names
      let namesHtml;
      if (entries.length === 0) {
        namesHtml = `<span class="sbl-empty">Sin anotados</span>`;
      } else {
        namesHtml = entries.map(([,v]) => {
          const me = v.nombre === myName;
          return me
            ? `<span class="sbl-mine">✓ ${escHtml(v.nombre)}</span>`
            : escHtml(v.nombre);
        }).join(" · ");
      }

      html += `
        <div class="sbl-row">
          <div class="sbl-top">
            <span class="sbl-time">${bl.replace("-"," – ")}</span>
            <div class="sbl-dots">${dots}</div>
            <div class="sbl-action">${actionBtn}</div>
          </div>
          <div class="sbl-names">${namesHtml}</div>
        </div>
      `;
    }
    document.getElementById("sheetBlocks").innerHTML = html;
  }

  // ── BANNER ─────────────────────────────────────────────
  function getMyTurns() {
    const todayDow = new Date().getDay();
    const turns    = [];
    for (const { dia, bloques, ubicaciones } of SCHEDULE) {
      const dow = DAY_INDEX[dia];
      for (const bl of bloques) {
        for (const ub of ubicaciones) {
          const vals = Object.values(turnosData[turnoId(dia, bl, ub)]?.anotados || {});
          if (vals.some(v => v.nombre === myName)) {
            turns.push({ dia, bl, ub, dist: (dow - todayDow + 7) % 7 });
          }
        }
      }
    }
    return turns
      .sort((a, b) => a.dist !== b.dist ? a.dist - b.dist : a.bl.localeCompare(b.bl))
      .slice(0, 2);
  }

  function renderBanner() {
    document.getElementById("bannerUserName").textContent = myName;
    const turns = getMyTurns();
    const el    = document.getElementById("bannerTurns");
    if (turns.length === 0) {
      el.innerHTML = `<span class="banner-no-turns">Sin turnos esta semana</span>`;
      return;
    }
    el.innerHTML = turns.map(t => `
      <div class="banner-turn">
        <div class="banner-turn-time">${SHORT_DAYS[t.dia]} · ${t.bl.split("-")[0]}</div>
        <div class="banner-turn-loc">${escHtml(t.ub)}</div>
      </div>
    `).join("");
  }

  // Primeros nombres, máximo 2 + "+N" si hay más
  function nameLabel(nameSet) {
    const arr   = [...nameSet];
    const shown = arr.slice(0, 2);
    if (arr.length > 2) shown.push(`+${arr.length - 2}`);
    return shown.join(", ");
  }

  // ── RENDER GRID ────────────────────────────────────────
  function render() {
    if (!myName) { showLogin(); return; }
    renderBanner();

    const todayDow = new Date().getDay();
    let html = `<div class="grid-section">`;

    html += `
      <div class="grid-legend">
        <div class="legend-item"><div class="legend-dot" style="background:#16a34a"></div>Con lugar</div>
        <div class="legend-item"><div class="legend-dot" style="background:#2563eb"></div>Yo anotado</div>
        <div class="legend-item"><div class="legend-dot" style="background:#ef4444"></div>Completo</div>
      </div>
    `;

    html += `<div class="grid-scroll-container"><div class="grid-wrap" id="gridWrap"><div class="schedule-grid">`;

    // Header row: empty corner + 7 day labels
    html += `<div></div>`;
    for (const dia of ALL_DAYS) {
      const isToday = DAY_INDEX[dia] === todayDow;
      html += `
        <div class="gh-day${isToday ? " gh-today" : ""}">
          <span>${SHORT_DAYS[dia]}</span>
          ${isToday ? `<div class="gh-pip"></div>` : ""}
        </div>
      `;
    }

    // One row per location
    for (const ub of ALL_LOCS) {
      html += `<div class="gl-loc">${escHtml(SHORT_LOC[ub]).replace("\n","<br>")}</div>`;

      for (const dia of ALL_DAYS) {
        const isToday   = DAY_INDEX[dia] === todayDow;
        const todayCls  = isToday ? " gc-today-col" : "";
        const bloques   = CELL_BLOCKS[`${dia}::${ub}`];

        if (!bloques) {
          // Sin turno: fondo plano, sin borde, sin interacción
          html += `<div class="gc gc-none"></div>`;
          continue;
        }

        // Aggregate state across all blocks for this (día × ubicación) cell
        let isMine = false, anyFree = false, anyPeople = false;
        const names = new Set();

        for (const bl of bloques) {
          const vals  = Object.values(turnosData[turnoId(dia, bl, ub)]?.anotados || {});
          const count = vals.length;
          if (vals.some(v => v.nombre === myName)) isMine = true;
          if (count < 4) anyFree = true;
          if (count > 0) anyPeople = true;
          vals.forEach(v => { if (v.nombre !== myName) names.add(v.nombre.split(" ")[0]); });
        }

        if (isMine) {
          // Punto azul como indicador; nombres de otros en azul 9px
          const label = nameLabel(names);
          html += `
            <div class="gc gc-mine${todayCls}" data-dia="${escHtml(dia)}" data-ub="${escHtml(ub)}">
              <div class="gc-pip"></div>
              ${label ? `<span class="gc-txt">${escHtml(label)}</span>` : ""}
            </div>
          `;
        } else if (!anyFree) {
          html += `
            <div class="gc gc-full${todayCls}" data-dia="${escHtml(dia)}" data-ub="${escHtml(ub)}">
              <span class="gc-txt">lleno</span>
            </div>
          `;
        } else if (anyPeople) {
          const label = nameLabel(names);
          html += `
            <div class="gc gc-with-people${todayCls}" data-dia="${escHtml(dia)}" data-ub="${escHtml(ub)}">
              <span class="gc-txt">${escHtml(label)}</span>
            </div>
          `;
        } else {
          html += `
            <div class="gc gc-free${todayCls}" data-dia="${escHtml(dia)}" data-ub="${escHtml(ub)}">
              <span class="gc-txt">libre</span>
            </div>
          `;
        }
      }
    }

    html += `</div></div><div class="scroll-fade" id="scrollFade"></div></div></div>`;
    document.getElementById("appContent").innerHTML = html;
    setupScrollFade();
  }

  // Gradiente derecho: desaparece cuando se llega al final del scroll
  function setupScrollFade() {
    const wrap = document.getElementById("gridWrap");
    const fade = document.getElementById("scrollFade");
    if (!wrap || !fade) return;
    const update = () => {
      const atEnd = Math.ceil(wrap.scrollLeft + wrap.clientWidth) >= wrap.scrollWidth;
      fade.classList.toggle("hidden", atEnd);
    };
    wrap.addEventListener("scroll", update, { passive: true });
    update();
  }

  // Grid cell click — event delegation, reads data-* attrs
  document.getElementById("appContent").addEventListener("click", e => {
    const cell = e.target.closest(".gc[data-dia]");
    if (!cell || cell.classList.contains("gc-none")) return;
    window.openSheet(cell.dataset.dia, cell.dataset.ub);
  });

  // ── INIT ───────────────────────────────────────────────
  if (!myName) {
    showLogin();
  } else {
    hideLogin();
  }
</script>
</body>
</html>
