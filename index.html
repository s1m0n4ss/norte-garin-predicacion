<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Predicación Pública · Norte Garín</title>
  <meta name="theme-color" content="#04091a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Predicación · Norte Garín" />
  <meta name="description" content="Programa de predicación pública con exhibidores · Congregación Norte Garín" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #04091a;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      font-size: 15px;
      -webkit-tap-highlight-color: transparent;
    }

    /* ── LOGIN ── */
    #loginScreen {
      position: fixed; inset: 0;
      background: #04091a;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
    }
    #loginScreen.vis { display: flex; }

    .login-box { width: 100%; max-width: 360px; text-align: center; }
    .login-eyebrow {
      font-size: 12px; font-weight: 700;
      letter-spacing: .18em; text-transform: uppercase;
      color: #60a5fa; margin-bottom: 10px;
    }
    .login-title {
      font-size: 28px; font-weight: 800;
      color: #f1f5f9; line-height: 1.15; margin-bottom: 8px;
    }
    .login-sub { font-size: 15px; color: #64748b; margin-bottom: 44px; }
    .login-input {
      width: 100%;
      background: #0f172a;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px;
      color: #f1f5f9;
      padding: 18px 20px;
      font-size: 17px;
      outline: none;
      transition: border-color .15s;
      margin-bottom: 14px;
      text-align: center;
    }
    .login-input::placeholder { color: #475569; }
    .login-input:focus { border-color: #60a5fa; }
    .login-btn {
      width: 100%;
      background: #2563eb;
      color: #fff; border: none;
      border-radius: 14px;
      padding: 18px;
      font-size: 17px; font-weight: 700;
      cursor: pointer; transition: background .15s;
    }
    .login-btn:active { background: #1d4ed8; }

    /* ── HEADER ── */
    #appHeader {
      display: none;
      position: sticky; top: 0; z-index: 40;
      background: #04091a;
      border-bottom: 1px solid rgba(255,255,255,0.07);
      padding: 12px 16px;
    }
    #appHeader.vis { display: block; }
    .header-inner {
      max-width: 720px; margin: 0 auto;
      display: flex; align-items: center; justify-content: space-between;
    }
    .header-title { font-size: 16px; font-weight: 700; color: #f1f5f9; }
    .header-sub   { font-size: 12px; color: #475569; margin-top: 1px; }
    .user-pill {
      background: rgba(96,165,250,0.1);
      border: 1px solid rgba(96,165,250,0.25);
      border-radius: 20px;
      padding: 7px 14px;
      font-size: 13px; color: #93c5fd;
      cursor: pointer;
      max-width: 170px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      transition: background .15s;
    }
    .user-pill:active { background: rgba(96,165,250,0.2); }

    /* ── LOADING ── */
    #loadingState {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 100px 0;
    }
    .spinner {
      width: 30px; height: 30px;
      border: 2px solid rgba(255,255,255,0.1);
      border-top-color: #60a5fa;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      margin-bottom: 14px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── CONTENT ── */
    #appContent {
      display: none;
      max-width: 720px;
      margin: 0 auto;
      padding: 16px 12px 100px;
    }
    #appContent.vis { display: block; }

    /* ── DAY SECTION ── */
    .day-section { margin-bottom: 28px; scroll-margin-top: 72px; }
    .day-header {
      display: flex; align-items: center; gap: 12px;
      padding: 11px 14px;
      background: #111827;
      border-left: 3px solid #1e3a5f;
      border-radius: 0 10px 10px 0;
      margin-bottom: 10px;
    }
    .day-header.today { border-left-color: #60a5fa; }
    .day-name {
      font-size: 12px; font-weight: 800;
      letter-spacing: .14em; text-transform: uppercase;
      color: #475569;
    }
    .day-header.today .day-name { color: #60a5fa; }
    .today-badge {
      background: rgba(96,165,250,0.15);
      color: #60a5fa;
      border: 1px solid rgba(96,165,250,0.3);
      border-radius: 20px;
      padding: 2px 10px;
      font-size: 11px; font-weight: 700;
    }

    /* ── TABLE ── */
    .day-table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .schedule-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0 4px;
    }
    .schedule-table th {
      font-size: 11px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .07em;
      color: #334155;
      padding: 4px 6px 8px;
      text-align: center;
    }
    .schedule-table th.th-time {
      text-align: left;
      min-width: 82px; width: 82px;
      padding-left: 2px;
    }
    .schedule-table td { padding: 0 4px 0 0; vertical-align: top; }
    .schedule-table td.td-time {
      padding: 0 8px 0 0;
      vertical-align: middle;
    }
    .time-label {
      font-size: 12px; font-weight: 600;
      color: #94a3b8; white-space: nowrap;
      line-height: 1.3;
    }

    /* ── CELL ── */
    .slot-cell {
      min-height: 64px;
      min-width: 88px;
      border-radius: 10px;
      padding: 7px 8px 8px;
      cursor: pointer;
      position: relative;
      border: 1px solid transparent;
      display: flex; flex-direction: column; gap: 3px;
      transition: filter .12s;
    }
    .slot-cell:active { filter: brightness(1.25); }
    .slot-free { background: #052e16; border-color: rgba(52,211,153,0.3); }
    .slot-one  { background: #2d1c00; border-color: rgba(251,191,36,0.38); }
    .slot-full { background: #2d0a0a; border-color: rgba(248,113,113,0.25); cursor: default; }
    .slot-mine { background: #0c1a3d; border-color: rgba(96,165,250,0.45); }

    .slot-counter {
      position: absolute; top: 6px; right: 7px;
      font-size: 10px; font-weight: 700;
      color: rgba(255,255,255,0.25);
    }
    .slot-libre {
      font-size: 12px; color: rgba(52,211,153,0.55);
      margin-top: auto; margin-bottom: auto;
    }
    .slot-names {
      font-size: 11px; line-height: 1.55;
      color: #64748b; margin-top: 2px;
    }
    .slot-names .mine-name { color: #93c5fd; font-weight: 700; }

    /* ── BOTTOM SHEET ── */
    #sheetOverlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0);
      z-index: 60; display: none;
      transition: background .25s;
    }
    #sheetOverlay.open { display: block; background: rgba(0,0,0,0.65); }

    #bottomSheet {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: #0f172a;
      border: 1px solid rgba(255,255,255,0.08);
      border-bottom: none;
      border-radius: 20px 20px 0 0;
      padding: 0 20px calc(24px + env(safe-area-inset-bottom));
      z-index: 61;
      transform: translateY(100%);
      transition: transform .3s cubic-bezier(.32,.72,0,1);
      max-width: 640px;
      margin: 0 auto;
    }
    #bottomSheet.open { transform: translateY(0); }

    .sheet-handle {
      width: 36px; height: 4px;
      background: rgba(255,255,255,0.13);
      border-radius: 2px;
      margin: 14px auto 20px;
    }
    .sheet-title {
      font-size: 18px; font-weight: 700;
      color: #f1f5f9; margin-bottom: 3px;
    }
    .sheet-subtitle { font-size: 13px; color: #64748b; margin-bottom: 20px; }

    .sheet-anotados {
      background: #080f1e;
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 12px;
      padding: 4px 14px;
      margin-bottom: 14px;
      min-height: 52px;
    }
    .sheet-person {
      display: flex; align-items: center; gap: 9px;
      padding: 10px 0;
      font-size: 15px; color: #cbd5e1;
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }
    .sheet-person:last-child { border-bottom: none; }
    .sheet-person.is-me { color: #93c5fd; font-weight: 700; }
    .sheet-empty {
      font-size: 13px; color: #475569;
      text-align: center; padding: 14px 0;
    }
    .sheet-spots {
      font-size: 14px; color: #64748b;
      text-align: center; margin-bottom: 16px;
    }
    .sheet-btn {
      width: 100%; border: none; border-radius: 14px;
      padding: 17px; font-size: 16px; font-weight: 700;
      cursor: pointer; transition: filter .12s;
    }
    .sheet-btn:active { filter: brightness(.9); }
    .sheet-btn-join  { background: #15803d; color: #fff; }
    .sheet-btn-leave { background: rgba(248,113,113,0.12); color: #f87171; border: 1px solid rgba(248,113,113,0.28); }
    .sheet-btn-full  { background: #1e293b; color: #475569; cursor: default; font-weight: 600; }
  </style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="loginScreen">
  <div class="login-box">
    <div class="login-eyebrow">Norte Garín</div>
    <div class="login-title">Predicación<br>Pública</div>
    <div class="login-sub">Ingresá tu nombre para ver y anotarte en los turnos</div>
    <input type="text" id="nameInput" class="login-input" placeholder="Tu nombre completo" autocomplete="name" />
    <button class="login-btn" onclick="saveName()">Ingresar</button>
  </div>
</div>

<!-- HEADER -->
<header id="appHeader">
  <div class="header-inner">
    <div>
      <div class="header-title">Predicación Pública</div>
      <div class="header-sub">Norte Garín</div>
    </div>
    <div id="userPill" class="user-pill" onclick="showLogin()" title="Cambiar nombre"></div>
  </div>
</header>

<!-- LOADING -->
<div id="loadingState">
  <div class="spinner"></div>
  <div style="font-size:14px;color:#475569">Cargando programa...</div>
</div>

<!-- CONTENT -->
<div id="appContent"></div>

<!-- SHEET OVERLAY -->
<div id="sheetOverlay" onclick="closeSheet()"></div>

<!-- BOTTOM SHEET -->
<div id="bottomSheet">
  <div class="sheet-handle"></div>
  <div id="sheetTitle" class="sheet-title"></div>
  <div id="sheetSubtitle" class="sheet-subtitle"></div>
  <div id="sheetAnotados" class="sheet-anotados"></div>
  <div id="sheetSpots" class="sheet-spots"></div>
  <button id="sheetBtn" class="sheet-btn"></button>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script>
  const firebaseConfig = {
    apiKey:            "AIzaSyAiIdLMX-Et4vHIGNE-5bKd_8GN_hsRiYI",
    authDomain:        "predicacion-publica-850aa.firebaseapp.com",
    databaseURL:       "https://predicacion-publica-850aa-default-rtdb.firebaseio.com",
    projectId:         "predicacion-publica-850aa",
    storageBucket:     "predicacion-publica-850aa.firebasestorage.app",
    messagingSenderId: "312049713615",
    appId:             "1:312049713615:web:e07a898e7a0df4c87dd2ba",
    measurementId:     "G-0WC3TV34T5"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  const UBICACIONES_SEMANA = ["Hospital Garín", "Estación Garín", "Puente 5"];
  const UBICACION_DOMINGO  = ["Mini Estación Garín"];

  const SCHEDULE = [
    { dia: "Lunes",     bloques: ["07:00-08:00","08:00-09:00","15:00-16:00","16:00-17:00"],                          ubicaciones: UBICACIONES_SEMANA },
    { dia: "Martes",    bloques: ["07:00-08:00","08:00-09:00","09:00-10:00","10:00-11:00","11:00-12:00"],             ubicaciones: UBICACIONES_SEMANA },
    { dia: "Miércoles", bloques: ["15:00-16:00","16:00-17:00","17:00-18:00","18:00-19:00","19:00-20:00"],             ubicaciones: UBICACIONES_SEMANA },
    { dia: "Jueves",    bloques: ["07:00-08:00","08:00-09:00"],                                                       ubicaciones: UBICACIONES_SEMANA },
    { dia: "Viernes",   bloques: ["07:00-08:00","08:00-09:00","17:00-18:00","18:00-19:00","19:00-20:00"],             ubicaciones: UBICACIONES_SEMANA },
    { dia: "Sábado",    bloques: ["07:00-08:00","08:00-09:00"],                                                       ubicaciones: UBICACIONES_SEMANA },
    { dia: "Domingo",   bloques: ["17:00-18:00","18:00-19:00","19:00-20:00"],                                         ubicaciones: UBICACION_DOMINGO  },
  ];

  const DAY_INDEX = { "Lunes":1,"Martes":2,"Miércoles":3,"Jueves":4,"Viernes":5,"Sábado":6,"Domingo":0 };

  const SHORT_NAME = {
    "Hospital Garín":     "Hospital",
    "Estación Garín":     "Estación",
    "Puente 5":           "Puente 5",
    "Mini Estación Garín":"Mini Est."
  };

  function turnoId(dia, bloque, ubicacion) {
    const [ini, fin] = bloque.split("-");
    const d = dia.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
    const u = ubicacion.toLowerCase().replace(/\s+/g,"").normalize("NFD").replace(/[̀-ͯ]/g,"");
    return `${d}_${ini.replace(":","")}_${fin.replace(":","")}_${u}`;
  }

  function daySlug(dia) {
    return dia.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
  }

  function escHtml(s) {
    return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }

  let myName       = localStorage.getItem("predicacion_nombre") || "";
  let turnosData   = {};
  let fbLoaded     = false;
  let scrolledOnce = false;
  let sheetTid     = null;

  // ── NAME ──────────────────────────────────────────────
  window.saveName = function() {
    const v = document.getElementById("nameInput").value.trim();
    if (!v) return;
    myName = v;
    localStorage.setItem("predicacion_nombre", v);
    hideLogin();
    if (fbLoaded) render();
  };

  window.showLogin = function() {
    document.getElementById("nameInput").value = myName;
    document.getElementById("loginScreen").classList.add("vis");
    document.getElementById("appHeader").classList.remove("vis");
    document.getElementById("appContent").classList.remove("vis");
    setTimeout(() => document.getElementById("nameInput").focus(), 80);
  };

  function hideLogin() {
    document.getElementById("loginScreen").classList.remove("vis");
    document.getElementById("appHeader").classList.add("vis");
    document.getElementById("appContent").classList.add("vis");
    document.getElementById("userPill").textContent = myName;
  }

  document.getElementById("nameInput").addEventListener("keydown", e => {
    if (e.key === "Enter") window.saveName();
  });

  // ── FIREBASE ──────────────────────────────────────────
  const turnosRef = db.ref("predicacion/turnos");
  turnosRef.on("value", snap => {
    turnosData = snap.val() || {};
    fbLoaded = true;
    document.getElementById("loadingState").style.display = "none";
    if (myName) {
      hideLogin();
      render();
    }
    if (sheetTid) refreshSheet();
  });

  window.anotarme = async function(tid) {
    const turno = turnosData[tid] || {};
    const anotados = turno.anotados || {};
    if (Object.keys(anotados).length >= 4) return;
    await db.ref(`predicacion/turnos/${tid}/anotados`).push({ nombre: myName, timestamp: Date.now() });
  };

  window.desanotarme = async function(tid) {
    const turno = turnosData[tid] || {};
    const anotados = turno.anotados || {};
    for (const [pid, val] of Object.entries(anotados)) {
      if (val.nombre === myName) {
        await db.ref(`predicacion/turnos/${tid}/anotados/${pid}`).remove();
        return;
      }
    }
  };

  // ── BOTTOM SHEET ──────────────────────────────────────
  window.openSheet = function(tid, dia, bloque, ubicacion) {
    sheetTid = tid;
    document.getElementById("sheetTitle").textContent = `${ubicacion} · ${bloque.replace("-"," – ")}`;
    document.getElementById("sheetSubtitle").textContent = dia;
    refreshSheet();
    document.getElementById("sheetOverlay").classList.add("open");
    document.getElementById("bottomSheet").classList.add("open");
  };

  window.closeSheet = function() {
    sheetTid = null;
    document.getElementById("sheetOverlay").classList.remove("open");
    document.getElementById("bottomSheet").classList.remove("open");
  };

  function refreshSheet() {
    if (!sheetTid) return;
    const tid = sheetTid;
    const turno    = turnosData[tid] || {};
    const entries  = Object.entries(turno.anotados || {}).sort((a,b) => a[1].timestamp - b[1].timestamp);
    const count    = entries.length;
    const isMine   = entries.some(([,v]) => v.nombre === myName);
    const full     = count >= 4;
    const spotsLeft = 4 - count;

    const iconPerson = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#475569" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>`;
    const iconCheck  = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#93c5fd" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>`;

    const anotadosEl = document.getElementById("sheetAnotados");
    if (count === 0) {
      anotadosEl.innerHTML = '<div class="sheet-empty">Nadie anotado aún</div>';
    } else {
      anotadosEl.innerHTML = entries.map(([,v]) => {
        const me = v.nombre === myName;
        return `<div class="sheet-person ${me ? "is-me" : ""}">${me ? iconCheck : iconPerson}${escHtml(v.nombre)}</div>`;
      }).join("");
    }

    const spotsEl = document.getElementById("sheetSpots");
    spotsEl.textContent = full
      ? "Turno completo"
      : `Quedan ${spotsLeft} lugar${spotsLeft === 1 ? "" : "es"}`;

    const btn = document.getElementById("sheetBtn");
    if (isMine) {
      btn.textContent = "Desanotarme";
      btn.className   = "sheet-btn sheet-btn-leave";
      btn.onclick     = () => { desanotarme(tid); closeSheet(); };
    } else if (full) {
      btn.textContent = "Turno completo";
      btn.className   = "sheet-btn sheet-btn-full";
      btn.onclick     = null;
    } else {
      btn.textContent = "Anotarme";
      btn.className   = "sheet-btn sheet-btn-join";
      btn.onclick     = () => { anotarme(tid); closeSheet(); };
    }
  }

  // ── RENDER ────────────────────────────────────────────
  function render() {
    if (!myName) { showLogin(); return; }
    document.getElementById("userPill").textContent = myName;

    const todayDow = new Date().getDay();
    let todayDia   = null;
    let html       = "";

    for (const { dia, bloques, ubicaciones } of SCHEDULE) {
      const isToday = DAY_INDEX[dia] === todayDow;
      if (isToday) todayDia = dia;
      const slug = daySlug(dia);

      // Day header
      html += `
        <div class="day-section" id="day-${slug}">
          <div class="day-header${isToday ? " today" : ""}">
            <span class="day-name">${dia}</span>
            ${isToday ? '<span class="today-badge">Hoy</span>' : ""}
          </div>
          <div class="day-table-wrap">
          <table class="schedule-table">
            <thead><tr>
              <th class="th-time">Horario</th>
              ${ubicaciones.map(u => `<th>${SHORT_NAME[u] || u}</th>`).join("")}
            </tr></thead>
            <tbody>
      `;

      for (const bl of bloques) {
        html += `<tr><td class="td-time"><div class="time-label">${bl.replace("-","–")}</div></td>`;

        for (const ub of ubicaciones) {
          const tid      = turnoId(dia, bl, ub);
          const entries  = Object.entries((turnosData[tid]?.anotados) || {}).sort((a,b) => a[1].timestamp - b[1].timestamp);
          const count    = entries.length;
          const isMine   = entries.some(([,v]) => v.nombre === myName);
          const full     = count >= 4;
          const oneLeft  = count === 3;

          let cellClass = "slot-free";
          if (isMine)       cellClass = "slot-mine";
          else if (full)    cellClass = "slot-full";
          else if (oneLeft) cellClass = "slot-one";

          // Safely encode for onclick attribute: JSON stringify the strings
          const onclickAttr = `openSheet(${JSON.stringify(tid)},${JSON.stringify(dia)},${JSON.stringify(bl)},${JSON.stringify(ub)})`;

          let bodyHtml;
          if (entries.length === 0) {
            bodyHtml = `<div class="slot-libre">Libre</div>`;
          } else {
            const lines = entries.map(([,v]) =>
              v.nombre === myName
                ? `<span class="mine-name">✓ ${escHtml(v.nombre)}</span>`
                : escHtml(v.nombre)
            ).join("<br>");
            bodyHtml = `<div class="slot-names">${lines}</div>`;
          }

          html += `
            <td>
              <div class="slot-cell ${cellClass}" onclick="${onclickAttr}">
                <div class="slot-counter">${count}/4</div>
                ${bodyHtml}
              </div>
            </td>`;
        }

        html += `</tr>`;
      }

      html += `</tbody></table></div></div>`;
    }

    document.getElementById("appContent").innerHTML = html;

    // Scroll to today on first render
    if (!scrolledOnce && todayDia) {
      scrolledOnce = true;
      const el = document.getElementById("day-" + daySlug(todayDia));
      if (el) setTimeout(() => el.scrollIntoView({ behavior: "smooth", block: "start" }), 180);
    }
  }

  // ── INIT ──────────────────────────────────────────────
  if (!myName) {
    showLogin();
  } else {
    document.getElementById("userPill").textContent = myName;
    hideLogin();
  }
</script>
</body>
</html>
