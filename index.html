<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Predicación Pública · Norte Garín</title>
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Predicación">
  <meta name="description" content="Programa de predicación pública con exhibidores · Congregación Norte Garín">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #2563EB;
      --primary-dark: #1E40AF;
      --success: #10B981;
      --danger: #EF4444;
      --dark: #0F172A;
      --gray-100: #F1F5F9;
      --gray-300: #CBD5E1;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #F1F5F9;
      color: #0F172A;
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100vh;
      -webkit-tap-highlight-color: transparent;
    }

    /* ── LOGIN SCREEN ── */
    #loginScreen {
      position: fixed; inset: 0;
      background: #F1F5F9;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
    }
    #loginScreen.vis { display: flex; }

    .login-card {
      width: 100%; max-width: 380px;
      background: #fff;
      border-radius: 20px;
      padding: 36px 28px;
      box-shadow: 0 4px 40px rgba(15,23,42,0.10);
      text-align: center;
    }

    .login-logo {
      width: 56px; height: 56px;
      background: #0f172a;
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 20px;
      font-family: 'Poppins', sans-serif;
      font-size: 22px;
      font-weight: 900;
      line-height: 1;
      user-select: none;
    }
    .login-logo .pp-blue { color: #2563eb; }
    .login-logo .pp-white { color: #fff; }

    .login-title {
      font-family: 'Poppins', sans-serif;
      font-size: 24px; font-weight: 700;
      color: #0F172A; margin-bottom: 4px;
    }
    .login-sub {
      font-family: 'Inter', sans-serif;
      font-size: 13px; color: #94a3b8;
      margin-bottom: 32px;
    }
    .login-input {
      width: 100%;
      height: 52px;
      background: #fff;
      border: 1.5px solid #E2E8F0;
      border-radius: 14px;
      color: #0f172a;
      padding: 0 20px;
      font-size: 16px; font-family: 'Inter', sans-serif;
      outline: none;
      transition: border-color .15s;
      margin-bottom: 14px;
      text-align: center;
    }
    .login-input::placeholder { color: #CBD5E1; }
    .login-input:focus { border-color: #2563EB; }
    .login-btn {
      width: 100%;
      height: 52px;
      background: #2563EB;
      color: #fff; border: none;
      border-radius: 14px;
      font-family: 'Poppins', sans-serif;
      font-size: 16px; font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(37,99,235,0.35);
      transition: background .15s;
    }
    .login-btn:active { background: #1E40AF; }

    /* ── BANNER ── */
    #appBanner {
      background: linear-gradient(135deg, #0F172A 0%, #1e2937 100%);
      padding: 28px 20px 24px;
      position: sticky; top: 0; z-index: 30;
      overflow: hidden;
      display: none;
    }
    #appBanner.vis { display: block; }

    .banner-deco1 {
      position: absolute;
      width: 180px; height: 180px;
      top: -40px; right: -40px;
      background: rgba(96,165,250,0.08);
      border-radius: 50%;
      pointer-events: none;
    }
    .banner-deco2 {
      position: absolute;
      width: 140px; height: 140px;
      bottom: -60px; left: -30px;
      background: rgba(96,165,250,0.04);
      border-radius: 50%;
      pointer-events: none;
    }

    .banner-inner { max-width: 800px; margin: 0 auto; position: relative; }

    .banner-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .banner-eyebrow {
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      color: rgba(255,255,255,0.5);
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 5px;
    }
    .banner-title {
      display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap;
    }
    .banner-title-bold {
      font-family: 'Poppins', sans-serif;
      font-size: 28px; font-weight: 700;
      color: #fff; line-height: 1.05;
    }
    .banner-title-light {
      font-family: 'Poppins', sans-serif;
      font-size: 28px; font-weight: 400;
      color: #bae6fd; line-height: 1.05;
    }

    .banner-user-card {
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 16px;
      padding: 10px 16px;
      flex-shrink: 0;
    }
    .banner-user-label {
      font-family: 'Inter', sans-serif;
      font-size: 10px;
      color: rgba(255,255,255,0.7);
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 3px;
    }
    #bannerUserName {
      font-family: 'Inter', sans-serif;
      font-size: 15px; font-weight: 700;
      color: #fff;
      cursor: pointer;
      max-width: 120px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      display: block;
    }

    .banner-turns-row {
      margin-top: 22px;
      display: flex; gap: 12px;
    }
    #bannerTurns { display: flex; gap: 12px; flex: 1; }

    .banner-turn-card {
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 14px;
      padding: 12px 14px;
      flex: 1;
      border: 1px solid rgba(255,255,255,0.1);
      min-width: 0;
    }
    .turn-card-time {
      font-family: 'Inter', sans-serif;
      font-size: 11px; color: #bae6fd;
      margin-bottom: 3px;
    }
    .turn-card-loc {
      font-family: 'Poppins', sans-serif;
      font-size: 14px; font-weight: 700;
      color: #fff;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }

    /* ── LEGEND BAR ── */
    #legendBar {
      display: none;
      background: #fff;
      padding: 12px 20px;
      border-bottom: 1px solid #E2E8F0;
    }
    #legendBar.vis { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; }

    .legend-item {
      display: flex; align-items: center; gap: 5px;
      font-family: 'Inter', sans-serif;
      font-size: 12px; color: #64748b;
    }
    .legend-dot {
      width: 10px; height: 10px;
      border-radius: 50%; flex-shrink: 0;
    }

    /* ── LOADING ── */
    #loadingState {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 100px 0;
    }
    .spinner {
      width: 28px; height: 28px;
      border: 2.5px solid #e2e8f0;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      margin-bottom: 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-txt {
      font-family: 'Inter', sans-serif;
      font-size: 13px; color: #94a3b8;
    }

    /* ── APP CONTENT ── */
    #appContent {
      display: none;
      max-width: 800px;
      margin: 0 auto;
      padding: 16px 12px 100px;
    }
    #appContent.vis { display: block; }

    /* ── GRID ── */
    .grid-scroll-container { position: relative; }
    .grid-wrap {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    .scroll-fade {
      position: absolute;
      top: 0; right: 0; bottom: 0; width: 52px;
      background: linear-gradient(to right, transparent, #F1F5F9);
      pointer-events: none;
      transition: opacity .18s;
      z-index: 2;
    }
    .scroll-fade.hidden { opacity: 0; }

    .schedule-grid {
      display: grid;
      grid-template-columns: 72px repeat(7, 1fr);
      min-width: 540px;
      gap: 4px;
    }

    .gh-day {
      font-family: 'Inter', sans-serif;
      font-size: 11px; font-weight: 700;
      text-align: center; color: #94a3b8;
      padding-bottom: 8px;
      display: flex; flex-direction: column; align-items: center; gap: 3px;
    }
    .gh-day.gh-today { color: #2563EB; }
    .gh-pip {
      width: 4px; height: 4px;
      border-radius: 50%; background: #2563EB;
    }

    .gl-loc {
      font-family: 'Inter', sans-serif;
      font-size: 10px; color: #94a3b8;
      text-transform: uppercase; letter-spacing: 0.04em;
      display: flex; align-items: center;
      padding-right: 4px; line-height: 1.3;
    }

    .gc {
      min-height: 68px;
      border-radius: 14px;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      gap: 4px;
      cursor: pointer;
      transition: transform .12s;
      position: relative;
      padding: 6px 4px;
      text-align: center;
    }
    .gc:not(.gc-none):active { transform: scale(0.96); }

    .gc-none { background: transparent; cursor: default; }

    .gc-free { background: #fff; border: 1.5px solid #CBD5E1; }
    .gc-with-people { background: #F0F9FF; border: 2px solid #7dd3fc; box-shadow: 0 2px 8px rgba(0,0,0,0.07); }
    .gc-mine { background: #ecfdf5; border: 2px solid #10B981; box-shadow: 0 2px 8px rgba(0,0,0,0.07); }
    .gc-full { background: #fef2f2; border: 2px solid #fca5a5; box-shadow: 0 2px 8px rgba(0,0,0,0.07); }

    .gc-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
    .gc-free .gc-dot { background: #CBD5E1; }
    .gc-with-people .gc-dot { background: #7dd3fc; }
    .gc-mine .gc-dot { background: #10B981; }
    .gc-full .gc-dot { background: #fca5a5; }

    .gc-text {
      font-size: 10px; font-weight: 700;
      font-family: 'Inter', sans-serif;
      line-height: 1;
    }
    .gc-free .gc-text { color: #CBD5E1; }
    .gc-with-people .gc-text { color: #2563EB; }
    .gc-mine .gc-text { color: #10B981; }
    .gc-full .gc-text { color: #EF4444; }

    .gc-today-col:not(.gc-none) { outline: 2px solid rgba(37,99,235,0.2); outline-offset: 1px; }

    /* ── BOTTOM SHEET ── */
    #sheetOverlay {
      position: fixed; inset: 0;
      background: rgba(15,23,42,0.5);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      z-index: 60; display: none;
    }
    #sheetOverlay.open { display: block; }

    #bottomSheet {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: #fff;
      border-radius: 24px 24px 0 0;
      padding: 6px 20px 40px;
      max-width: 480px;
      margin: 0 auto;
      z-index: 61;
      transform: translateY(100%);
      transition: transform .3s cubic-bezier(.32,.72,0,1);
      max-height: 88vh;
      overflow-y: auto;
      box-shadow: 0 -8px 40px rgba(0,0,0,0.18);
    }
    #bottomSheet.open { transform: translateY(0); }

    .sheet-drag-bar {
      width: 40px; height: 4px;
      background: #CBD5E1;
      border-radius: 2px;
      margin: 12px auto 20px;
    }

    .sheet-header {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 20px;
    }
    .sheet-loc-icon {
      width: 44px; height: 44px;
      background: #F1F5F9;
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      color: #64748b;
    }
    .sheet-loc-name {
      font-family: 'Poppins', sans-serif;
      font-size: 18px; font-weight: 700; color: #0F172A;
    }
    .sheet-day-lbl {
      font-family: 'Inter', sans-serif;
      font-size: 13px; color: #2563EB;
      margin-top: 2px;
    }

    .sheet-section-lbl {
      font-family: 'Inter', sans-serif;
      font-size: 11px; font-weight: 700;
      text-transform: uppercase;
      color: #CBD5E1;
      letter-spacing: 1.5px;
      margin-bottom: 12px;
    }

    .sbl-row { background: #F1F5F9; border-radius: 16px; padding: 14px 16px; margin-bottom: 10px; }
    .sbl-border-mine { border: 2px solid #10B981; }
    .sbl-border-full { border: 1px solid #fecaca; }
    .sbl-border-normal { border: 1px solid #e2e8f0; }
    .sbl-main { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .sbl-clock { flex-shrink: 0; }
    .sbl-info { flex: 1; min-width: 0; }
    .sbl-time { font-size: 15px; font-weight: 700; font-family: 'Inter', sans-serif; color: #0F172A; }
    .sbl-status { font-size: 12px; font-family: 'Inter', sans-serif; margin-top: 2px; }
    .sbl-dots { display: flex; gap: 4px; flex-shrink: 0; }
    .sbl-dot { width: 8px; height: 8px; border-radius: 50%; background: #E2E8F0; }
    .sbl-dot.sbl-dot-taken { background: #2563EB; }
    .sbl-dot.sbl-dot-mine { background: #10B981; }
    .sbl-action { flex-shrink: 0; }
    .sbl-btn-join {
      padding: 10px 20px; border-radius: 12px;
      background: #2563EB; color: #fff;
      font-size: 14px; font-weight: 700; font-family: 'Inter', sans-serif;
      min-width: 90px; box-shadow: 0 4px 12px rgba(37,99,235,0.3);
      border: none; cursor: pointer;
    }
    .sbl-btn-quit {
      padding: 10px 20px; border-radius: 12px;
      background: #fee2e2; color: #EF4444;
      font-size: 14px; font-weight: 700; font-family: 'Inter', sans-serif;
      min-width: 90px; border: 1px solid #fecaca; cursor: pointer;
    }
    .sbl-full-txt { color: #EF4444; font-size: 12px; font-weight: 600; font-family: 'Inter', sans-serif; }

    /* ── TOAST ── */
    .toast {
      position: fixed;
      bottom: 90px; left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #0F172A; color: #fff;
      border-radius: 14px; padding: 12px 20px;
      font-family: 'Inter', sans-serif; font-size: 14px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.25);
      opacity: 0; transition: opacity .25s, transform .25s;
      z-index: 200; white-space: nowrap;
      pointer-events: none;
    }
    .toast.toast-visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ── BOTTOM NAV ── */
    #bottomNav {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: #fff;
      border-top: 1px solid #E2E8F0;
      padding: 10px 0 calc(18px + env(safe-area-inset-bottom));
      box-shadow: 0 -2px 16px rgba(0,0,0,0.06);
      z-index: 40;
      display: none;
      justify-content: space-around;
      align-items: center;
      max-width: 480px; margin: 0 auto;
    }
    #bottomNav.vis { display: flex; }

    .nav-btn {
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      background: none; border: none; cursor: pointer;
      color: #CBD5E1; padding: 4px 16px;
      font-family: 'Inter', sans-serif; font-size: 10px; font-weight: 700;
      transition: color .15s;
    }
    .nav-btn.nav-active { color: #2563EB; }
    .nav-btn svg { width: 22px; height: 22px; }
  </style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="loginScreen">
  <div class="login-card">
    <div class="login-logo">
      <span class="pp-blue">P</span><span class="pp-white">P</span>
    </div>
    <div class="login-title">Predicación Pública</div>
    <div class="login-sub">Norte Garín · 2026</div>
    <input type="text" id="nameInput" class="login-input" placeholder="Tu nombre completo" autocomplete="name" />
    <button class="login-btn" onclick="saveName()">Ingresar</button>
  </div>
</div>

<!-- BANNER -->
<header id="appBanner">
  <div class="banner-deco1"></div>
  <div class="banner-deco2"></div>
  <div class="banner-inner">
    <div class="banner-top">
      <div>
        <div class="banner-eyebrow">Norte Garín · 2026</div>
        <div class="banner-title">
          <span class="banner-title-bold">Predicación</span>

<!-- LEGEND BAR -->

<!-- LOADING -->

<!-- APP CONTENT (grid) -->

<!-- BOTTOM SHEET -->
<div id="bottomSheet">

    <div class="sheet-loc-icon">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0 1 18 0z"/>
        <circle cx="12" cy="10" r="3"/>
      </svg>
    </div>

      <div id="sheetLoc" class="sheet-loc-name"></div>
      <div id="sheetDayLbl" class="sheet-day-lbl"></div>

  <div class="sheet-section-lbl">Horarios disponibles</div>
  <div id="sheetBlocks"></div>
</div>

<!-- TOAST -->
<div id="toastMsg" class="toast"></div>

<!-- BOTTOM NAV -->
<nav id="bottomNav">
  <button class="nav-btn nav-active" onclick="">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
      <polyline points="9 22 9 12 15 12 15 22"/>
    </svg>
    <span>Inicio</span>
  </button>
  <button class="nav-btn" onclick="document.getElementById('appContent').scrollIntoView({behavior:'smooth'})">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="4" width="18" height="18" rx="2"/>
      <line x1="16" y1="2" x2="16" y2="6"/>
      <line x1="8" y1="2" x2="8" y2="6"/>
      <line x1="3" y1="10" x2="21" y2="10"/>
    </svg>
    <span>Mis Turnos</span>
  </button>
  <button class="nav-btn" onclick="showLogin()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
      <circle cx="12" cy="7" r="4"/>
    </svg>
    <span>Perfil</span>
  </button>
</nav>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script>
  const firebaseConfig = {
    apiKey:            "AIzaSyAiIdLMX-Et4vHIGNE-5bKd_8GN_hsRiYI",

  const SCHEDULE = [
    { dia: "Lunes",     bloques: ["07:00-08:00","08:00-09:00","15:00-16:00","16:00-17:00"],                        ubicaciones: UBICACIONES_SEMANA },
    { dia: "Martes",    bloques: ["07:00-08:00","08:00-09:00","09:00-10:00","10:00-11:00","11:00-12:00"],           ubicaciones: UBICACIONES_SEMANA },
    { dia: "Miércoles", bloques: ["15:00-16:00","16:00-17:00","17:00-18:00","18:00-19:00","19:00-20:00"],           ubicaciones: UBICACIONES_SEMANA },
    { dia: "Jueves",    bloques: ["07:00-08:00","08:00-09:00"],                                                     ubicaciones: UBICACIONES_SEMANA },
    { dia: "Viernes",   bloques: ["07:00-08:00","08:00-09:00","17:00-18:00","18:00-19:00","19:00-20:00"],           ubicaciones: UBICACIONES_SEMANA },
    { dia: "Sábado",    bloques: ["07:00-08:00","08:00-09:00"],                                                     ubicaciones: UBICACIONES_SEMANA },
    { dia: "Domingo",   bloques: ["17:00-18:00","18:00-19:00","19:00-20:00"],                                       ubicaciones: UBICACION_DOMINGO  },
  ];

  const DAY_INDEX = { "Lunes":1,"Martes":2,"Miércoles":3,"Jueves":4,"Viernes":5,"Sábado":6,"Domingo":0 };

  const ALL_LOCS  = ["Hospital Garín","Estación Garín","Puente 5","Mini Estación Garín"];
  const ALL_DAYS  = ["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"];

  const SHORT_DAYS = {
    "Lunes":"Lun","Martes":"Mar","Miércoles":"Mié",
    "Jueves":"Jue","Viernes":"Vie","Sábado":"Sáb","Domingo":"Dom"
  };
  const SHORT_LOC = {
    "Hospital Garín":     "Hosp.\nGarín",
    "Estación Garín":     "Est.\nGarín",
    "Puente 5":           "Puente 5",
    "Mini Estación Garín":"Mini Est."
  };

  // "dia::ub" → [bloque, ...]
  const CELL_BLOCKS = {};
  for (const { dia, bloques, ubicaciones } of SCHEDULE) {
    for (const ub of ubicaciones) CELL_BLOCKS[`${dia}::${ub}`] = bloques;
  }

  // ── HELPERS ────────────────────────────────────────────
  function turnoId(dia, bloque, ubicacion) {
    const [ini, fin] = bloque.split("-");
    const d = dia.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
    const u = ubicacion.toLowerCase().replace(/\s+/g,"").normalize("NFD").replace(/[̀-ͯ]/g,"");
    return `${d}_${ini.replace(":","")}_${fin.replace(":","")}_${u}`;
  }

  function escHtml(s) {
    return String(s)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;")
      .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  // ── STATE ──────────────────────────────────────────────
  let myName       = localStorage.getItem("predicacion_nombre") || "";
  let turnosData   = {};
  let fbLoaded     = false;
  let sheetCellDia = null;
  let sheetCellUb  = null;

  // ── TOAST ──────────────────────────────────────────────
  function showToast(msg) {
    const t = document.getElementById("toastMsg");
    t.textContent = msg;
    t.classList.add("toast-visible");
    clearTimeout(t._tid);
    t._tid = setTimeout(() => t.classList.remove("toast-visible"), 2500);
  }

  // ── NAME ───────────────────────────────────────────────
  window.saveName = function() {
    const v = document.getElementById("nameInput").value.trim();
    if (!v) return;
    myName = v;
    localStorage.setItem("predicacion_nombre", v);
    hideLogin();
    if (fbLoaded) render();
  };

  window.showLogin = function() {
    document.getElementById("nameInput").value = myName;
    document.getElementById("loginScreen").classList.add("vis");
    document.getElementById("appBanner").classList.remove("vis");
    document.getElementById("legendBar").classList.remove("vis");
    document.getElementById("appContent").classList.remove("vis");
    document.getElementById("bottomNav").classList.remove("vis");
    setTimeout(() => document.getElementById("nameInput").focus(), 80);
  };

  function hideLogin() {
    document.getElementById("loginScreen").classList.remove("vis");
    document.getElementById("appBanner").classList.add("vis");
    document.getElementById("legendBar").classList.add("vis");
    document.getElementById("appContent").classList.add("vis");
    document.getElementById("bottomNav").classList.add("vis");
  }

  document.getElementById("nameInput").addEventListener("keydown", e => {
    if (e.key === "Enter") window.saveName();
  });

  // ── FIREBASE ───────────────────────────────────────────
  const turnosRef = db.ref("predicacion/turnos");
  turnosRef.on("value", snap => {
    turnosData = snap.val() || {};
    fbLoaded   = true;
    document.getElementById("loadingState").style.display = "none";
    if (myName) { hideLogin(); render(); }
    if (sheetCellDia) refreshSheet();
  });

  window.anotarme = async function(tid) {
    const anotados = turnosData[tid]?.anotados || {};
    if (Object.keys(anotados).length >= 4) return;
    await db.ref(`predicacion/turnos/${tid}/anotados`).push({ nombre: myName, timestamp: Date.now() });
    showToast("¡Te anotaste exitosamente!");
  };

  window.desanotarme = async function(tid) {
    const anotados = turnosData[tid]?.anotados || {};
    for (const [pid, val] of Object.entries(anotados)) {
      if (val.nombre === myName) {
        await db.ref(`predicacion/turnos/${tid}/anotados/${pid}`).remove();
        showToast("Te desanotaste del turno");
        return;
      }
    }
  };

  // ── BOTTOM SHEET ───────────────────────────────────────
  window.openSheet = function(dia, ub) {
    sheetCellDia = dia;
    sheetCellUb  = ub;
    document.getElementById("sheetLoc").textContent    = ub;
    document.getElementById("sheetDayLbl").textContent = dia;
    refreshSheet();
    document.getElementById("sheetOverlay").classList.add("open");
    document.getElementById("bottomSheet").classList.add("open");
    document.body.style.overflow = "hidden";
  };

  window.closeSheet = function() {
    sheetCellDia = null;
    sheetCellUb  = null;
    document.getElementById("sheetOverlay").classList.remove("open");
    document.getElementById("bottomSheet").classList.remove("open");
    document.body.style.overflow = "";
  };

  function refreshSheet() {
    if (!sheetCellDia) return;
    const dia    = sheetCellDia;
    const ub     = sheetCellUb;
    const bloques = CELL_BLOCKS[`${dia}::${ub}`] || [];

    let html = "";
    const clockSvg = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>`;

    for (const bl of bloques) {
      const tid     = turnoId(dia, bl, ub);
      const entries = Object.entries(turnosData[tid]?.anotados || {})
                            .sort((a,b) => a[1].timestamp - b[1].timestamp);
      const count   = entries.length;
      const isMine  = entries.some(([,v]) => v.nombre === myName);
      const full    = count >= 4;

      const rowBorderCls = isMine ? "sbl-border-mine" : full ? "sbl-border-full" : "sbl-border-normal";
      const clockColor   = isMine ? "#10B981" : full ? "#EF4444" : "#94a3b8";

      // 4 dots
      const dots = Array.from({length: 4}, (_, i) => {
        if (i < count) {
          const isMeSlot = entries[i][1].nombre === myName;
          return `<div class="sbl-dot ${isMeSlot ? "sbl-dot-mine" : "sbl-dot-taken"}"></div>`;
        }
        return `<div class="sbl-dot"></div>`;
      }).join("");

      // Status text
      let statusText;
      if (isMine) statusText = `<span style="color:#10B981">✓ Vos anotado</span>`;
      else if (full) statusText = `<span style="color:#EF4444">Turno completo</span>`;
      else if (count > 0) {
        const names = entries.map(([,v]) => escHtml(v.nombre.split(" ")[0])).join(", ");
        statusText = `<span style="color:#94a3b8">${names}</span>`;
      } else {
        statusText = `<span style="color:#94a3b8">Sin anotados</span>`;
      }

      // Action
      let action;
      if (isMine) action = `<button class="sbl-btn-quit" onclick="window.desanotarme('${tid}')">Quitar</button>`;
      else if (full) action = `<span class="sbl-full-txt">Lleno</span>`;
      else action = `<button class="sbl-btn-join" onclick="window.anotarme('${tid}')">Anotar</button>`;

      html += `
        <div class="sbl-row ${rowBorderCls}">
          <div class="sbl-main">
            <div class="sbl-clock" style="color:${clockColor}">${clockSvg}</div>
            <div class="sbl-info">
              <div class="sbl-time">${bl.replace("-"," – ")}</div>
              <div class="sbl-status">${statusText}</div>
            </div>
            <div class="sbl-dots">${dots}</div>
            <div class="sbl-action">${action}</div>
          </div>
        </div>
      `;
    }
    document.getElementById("sheetBlocks").innerHTML = html;
  }

  // ── BANNER ─────────────────────────────────────────────
  function getMyTurns() {
    const todayDow = new Date().getDay();
    const turns    = [];
    for (const { dia, bloques, ubicaciones } of SCHEDULE) {
      const dow = DAY_INDEX[dia];
      for (const bl of bloques) {
        for (const ub of ubicaciones) {
          const vals = Object.values(turnosData[turnoId(dia, bl, ub)]?.anotados || {});
          if (vals.some(v => v.nombre === myName)) {
            turns.push({ dia, bl, ub, dist: (dow - todayDow + 7) % 7 });
          }
        }
      }
    }
    return turns
      .sort((a, b) => a.dist !== b.dist ? a.dist - b.dist : a.bl.localeCompare(b.bl))
      .slice(0, 2);
  }

  function renderBanner() {
    document.getElementById("bannerUserName").textContent = myName;
    const turns = getMyTurns();
    const el    = document.getElementById("bannerTurns");
    if (turns.length === 0) {
      el.innerHTML = '<span style="color:rgba(255,255,255,0.4);font-size:13px;font-style:italic">Sin turnos anotados</span>';
      return;
    }
    el.innerHTML = turns.map(t => `
      <div class="banner-turn-card">
        <div class="turn-card-time">${SHORT_DAYS[t.dia]} · ${t.bl.split("-")[0]}</div>
        <div class="turn-card-loc">${escHtml(t.ub)}</div>
      </div>
    `).join("");
  }

  // Primeros nombres, máximo 2 + "+N" si hay más
  function nameLabel(nameSet) {
    const arr   = [...nameSet];
    const shown = arr.slice(0, 2);
    if (arr.length > 2) shown.push(`+${arr.length - 2}`);
    return shown.join(", ");
  }

  // ── RENDER GRID ────────────────────────────────────────
  function render() {
    if (!myName) { showLogin(); return; }
    renderBanner();

    const todayDow = new Date().getDay();
    let html = `<div class="grid-scroll-container"><div class="grid-wrap" id="gridWrap"><div class="schedule-grid">`;

    // Header row: empty corner + 7 day labels
    html += `<div></div>`;
    for (const dia of ALL_DAYS) {
      const isToday = DAY_INDEX[dia] === todayDow;
      html += `
        <div class="gh-day${isToday ? " gh-today" : ""}">
          <span>${SHORT_DAYS[dia]}</span>
          ${isToday ? `<div class="gh-pip"></div>` : ""}
        </div>
      `;
    }

    // One row per location
    for (const ub of ALL_LOCS) {
      html += `<div class="gl-loc">${escHtml(SHORT_LOC[ub]).replace("\n","<br>")}</div>`;

      for (const dia of ALL_DAYS) {
        const isToday  = DAY_INDEX[dia] === todayDow;
        const todayCls = isToday ? " gc-today-col" : "";
        const bloques  = CELL_BLOCKS[`${dia}::${ub}`];

        if (!bloques) {
          html += `<div class="gc gc-none"></div>`;
          continue;
        }

        // Aggregate state across all blocks for this (día × ubicación) cell
        let isMine = false, anyFree = false, anyPeople = false, totalAnnotated = 0;
        const names = new Set();

        for (const bl of bloques) {
          const vals  = Object.values(turnosData[turnoId(dia, bl, ub)]?.anotados || {});
          const count = vals.length;
          if (vals.some(v => v.nombre === myName)) isMine = true;
          if (count < 4) anyFree = true;
          if (count > 0) anyPeople = true;
          totalAnnotated += count;
          vals.forEach(v => { if (v.nombre !== myName) names.add(v.nombre.split(" ")[0]); });
        }

        if (isMine) {
          html += `
            <div class="gc gc-mine${todayCls}" data-dia="${escHtml(dia)}" data-ub="${escHtml(ub)}">
              <div class="gc-dot"></div>
              <span class="gc-text">✓ Vos</span>
            </div>
          `;
        } else if (!anyFree) {
          html += `
            <div class="gc gc-full${todayCls}" data-dia="${escHtml(dia)}" data-ub="${escHtml(ub)}">
              <div class="gc-dot"></div>
              <span class="gc-text">Lleno</span>
            </div>
          `;
        } else if (anyPeople) {
          html += `
            <div class="gc gc-with-people${todayCls}" data-dia="${escHtml(dia)}" data-ub="${escHtml(ub)}">
              <div class="gc-dot"></div>
              <span class="gc-text">${totalAnnotated}</span>
            </div>
          `;
        } else {
          html += `
            <div class="gc gc-free${todayCls}" data-dia="${escHtml(dia)}" data-ub="${escHtml(ub)}">
              <div class="gc-dot"></div>
              <span class="gc-text">—</span>
            </div>
          `;
        }
      }
    }

    html += `</div></div><div class="scroll-fade" id="scrollFade"></div></div>`;
    document.getElementById("appContent").innerHTML = html;
    setupScrollFade();
  }

  // Gradiente derecho: desaparece cuando se llega al final del scroll
  function setupScrollFade() {
    const wrap = document.getElementById("gridWrap");
    const fade = document.getElementById("scrollFade");
    if (!wrap || !fade) return;
    const update = () => {
      const atEnd = Math.ceil(wrap.scrollLeft + wrap.clientWidth) >= wrap.scrollWidth;
      fade.classList.toggle("hidden", atEnd);
    };
    wrap.addEventListener("scroll", update, { passive: true });
    update();
  }

  // Grid cell click — event delegation, reads data-* attrs
  document.getElementById("appContent").addEventListener("click", e => {
    const cell = e.target.closest(".gc[data-dia]");
    if (!cell || cell.classList.contains("gc-none")) return;
    window.openSheet(cell.dataset.dia, cell.dataset.ub);
  });

  // ── INIT ───────────────────────────────────────────────
  if (!myName) {
    showLogin();
  } else {
    hideLogin();
  }
</script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js');
    });
  }
</script>
</body>
</html>
